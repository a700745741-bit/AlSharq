workflows:
  android-workflow:
    name: AlSharq APK
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      java: 17
    scripts:
      - name: Fix project structure
        script: |
          mkdir -p app/src/main
          echo "include ':app'" > settings.gradle
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx4g
          EOF
          cat > build.gradle <<'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.0' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.alsharq.global'
              compileSdk 34
              defaultConfig {
                  applicationId "com.alsharq.global"
                  minSdk 21
                  targetSdk 34
                  versionCode 7
                  versionName "1.3"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application android:label="الشرق العالمي" android:usesCleartextTraffic="true">
                  <activity android:name=".MainActivity" android:exported="true" android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          mkdir -p app/src/main/java/com/alsharq/global
          cat > app/src/main/java/com/alsharq/global/MainActivity.java <<'EOF'
          package com.alsharq.global;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.app.Activity;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.view.ViewGroup;
          import android.graphics.Color;
          public class MainActivity extends Activity {
              private WebView webView;
              private String fbUrl = "https://www.facebook.com/ALSHAREQ/";
              private String waUrl = "https://chat.whatsapp.com/GKe8JAo24dO4tjdY9XCMc0";
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  LinearLayout mainLayout = new LinearLayout(this);
                  mainLayout.setOrientation(LinearLayout.VERTICAL);
                  mainLayout.setBackgroundColor(Color.WHITE);

                  LinearLayout btnLayout = new LinearLayout(this);
                  btnLayout.setOrientation(LinearLayout.HORIZONTAL);
                  btnLayout.setBackgroundColor(Color.parseColor("#0d47a1"));
                  btnLayout.setPadding(10,10,10,10);

                  Button btnFb = new Button(this);
                  btnFb.setText("فيسبوك");
                  btnFb.setTextColor(Color.WHITE);
                  btnFb.setBackgroundColor(Color.parseColor("#1976d2"));
                  LinearLayout.LayoutParams p1 = new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1);
                  p1.setMargins(5,0,5,0);
                  btnFb.setLayoutParams(p1);

                  Button btnWa = new Button(this);
                  btnWa.setText("واتساب");
                  btnWa.setTextColor(Color.WHITE);
                  btnWa.setBackgroundColor(Color.parseColor("#25D366"));
                  LinearLayout.LayoutParams p2 = new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1);
                  p2.setMargins(5,0,5,0);
                  btnWa.setLayoutParams(p2);

                  btnLayout.addView(btnFb);
                  btnLayout.addView(btnWa);

                  webView = new WebView(this);
                  LinearLayout.LayoutParams wp = new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT);
                  webView.setLayoutParams(wp);
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  webView.setWebViewClient(new WebViewClient());

                  mainLayout.addView(btnLayout);
                  mainLayout.addView(webView);
                  setContentView(mainLayout);

                  webView.loadUrl(fbUrl);

                  btnFb.setOnClickListener(v -> webView.loadUrl(fbUrl));
                  btnWa.setOnClickListener(v -> webView.loadUrl(waUrl));
              }
              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }
          }
          EOF
          rm -rf ~/.gradle/caches .gradle app/build build
          if [ ! -f ./gradlew ]; then gradle wrapper --gradle-version 8.4; fi
          chmod +x ./gradlew
      - name: Build APK
        script: |
          ./gradlew clean :app:assembleDebug --refresh-dependencies
    artifacts:
      - app/build/outputs/apk/debug/*.apk
