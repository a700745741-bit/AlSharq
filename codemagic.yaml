workflows:
  android-workflow:
    name: AlSharq Team Full Features
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      java: 17
    scripts:
      - name: Build APK With All Features
        script: |
          set -e
          rm -rf app/build build .gradle
          mkdir -p app/src/main/java/com/alsharq/team
          echo "include ':app'" > settings.gradle
          echo "android.useAndroidX=true" > gradle.properties
          cat > build.gradle <<'ENDOFFILE'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.1.0' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          ENDOFFILE
          cat > app/build.gradle <<'ENDOFFILE'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.alsharq.team'
              compileSdk 33
              defaultConfig {
                  applicationId "com.alsharq.team"
                  minSdk 21; targetSdk 33
                  versionCode 13; versionName "3.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.cardview:cardview:1.0.0'
              implementation 'com.github.bumptech.glide:glide:4.16.0'
          }
          ENDOFFILE
          cat > app/src/main/AndroidManifest.xml <<'ENDOFFILE'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application android:label="فريق الشرق">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <activity android:name=".DetailActivity"/>
              </application>
          </manifest>
          ENDOFFILE
          cat > app/src/main/java/com/alsharq/team/MainActivity.java <<'ENDOFFILE'
