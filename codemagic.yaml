workflows:
  android-workflow:
    name: AlSharq APK
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      java: 17
    scripts:
      - name: Clean everything
        script: |
          rm -rf ~/.gradle/caches
          rm -rf .gradle
          rm -rf app/build
          rm -rf build
          if [ ! -f ./gradlew ]; then gradle wrapper --gradle-version 8.4; fi
          chmod +x ./gradlew
      - name: Build APK
        script: |
          ./gradlew clean :app:assembleDebug --refresh-dependencies --stacktrace
    artifacts:
      - app/build/outputs/apk/debug/*.apk
