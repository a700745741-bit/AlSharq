workflows:
  android-workflow:
    name: AlSharq APK
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      java: 17
    scripts:
      - name: Fix project structure
        script: |
          mkdir -p app/src/main
          echo "include ':app'" > settings.gradle
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx4g
          EOF
          cat > build.gradle <<'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.0' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.alsharq.global'
              compileSdk 34
              defaultConfig {
                  applicationId "com.alsharq.global"
                  minSdk 21
                  targetSdk 34
                  versionCode 5
                  versionName "1.1"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application android:label="الشرق العالمي" android:usesCleartextTraffic="true">
                  <activity android:name=".MainActivity" android:exported="true" android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          mkdir -p app/src/main/java/com/alsharq/global
          cat > app/src/main/java/com/alsharq/global/MainActivity.java <<'EOF'
          package com.alsharq.global;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.app.Activity;
          public class MainActivity extends Activity {
              private WebView webView;
              private String siteUrl = "https://alsharq-global.com";
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  setContentView(webView);
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onReceivedError(WebView view, WebResourceRequest request, WebResourceError error) {
                          String html = "<html dir='rtl'><body style='text-align:center;padding-top:100px;font-family:sans-serif;'><h2>الشرق العالمي</h2><p>الموقع غير متاح حاليا</p><p>تأكد من اتصال الانترنت أو حاول لاحقا</p><p style='color:gray;'>"+siteUrl+"</p><br><button onclick='window.location.reload()' style='padding:10px 20px;'>إعادة المحاولة</button></body></html>";
                          view.loadData(html, "text/html; charset=utf-8", "UTF-8");
                      }
                  });
                  webView.loadUrl(siteUrl);
              }
              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }
          }
          EOF
          rm -rf ~/.gradle/caches .gradle app/build build
          if [ ! -f ./gradlew ]; then gradle wrapper --gradle-version 8.4; fi
          chmod +x ./gradlew
      - name: Build APK
        script: |
          ./gradlew clean :app:assembleDebug --refresh-dependencies
    artifacts:
      - app/build/outputs/apk/debug/*.apk
