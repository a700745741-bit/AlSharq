workflows:
  android-workflow:
    name: AlSharq Team App Fixed
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      java: 17
    scripts:
      - name: Build Full APK
        script: |
          set -e
          rm -rf app/build build .gradle
          mkdir -p app/src/main/java/com/alsharq/team
          echo "include ':app'" > settings.gradle
          echo "android.useAndroidX=true" > gradle.properties
          cat > build.gradle <<'ENDOFFILE'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.0'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          ENDOFFILE
          cat > app/build.gradle <<'ENDOFFILE'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.alsharq.team'
              compileSdk 33
              defaultConfig {
                  applicationId "com.alsharq.team"
                  minSdk 21
                  targetSdk 33
                  versionCode 12
                  versionName "2.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.cardview:cardview:1.0.0'
          }
          ENDOFFILE
          cat > app/src/main/AndroidManifest.xml <<'ENDOFFILE'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application android:label="فريق الشرق">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <activity android:name=".DetailActivity"/>
              </application>
          </manifest>
          ENDOFFILE
          cat > app/src/main/java/com/alsharq/team/MainActivity.java <<'ENDOFFILE'
          package com.alsharq.team;
          import android.app.*;import android.content.*;import android.graphics.*;import android.graphics.drawable.*;import android.net.Uri;import android.os.Bundle;import android.view.*;import android.widget.*;import androidx.appcompat.app.AppCompatActivity;import androidx.cardview.widget.CardView;
          public class MainActivity extends AppCompatActivity{
          String fb="https://www.facebook.com/ALSHAREQ/";String wa="https://chat.whatsapp.com/GKe8JAo24dO4tjdY9XCMc0";
          protected void onCreate(Bundle b){super.onCreate(b);
          LinearLayout root=new LinearLayout(this);root.setOrientation(1);root.setBackgroundColor(Color.parseColor("#F5F7FB"));
          LinearLayout top=new LinearLayout(this);top.setOrientation(0);top.setPadding(15,10,15,10);top.setBackgroundColor(Color.parseColor("#0d47a1"));
          Button bf=new Button(this);bf.setText("فيسبوك");bf.setTextColor(Color.WHITE);bf.setBackgroundColor(Color.parseColor("#1877F2"));bf.setOnClickListener(v->{startActivity(new Intent(Intent.ACTION_VIEW,Uri.parse(fb)));});
          Button bw=new Button(this);bw.setText("واتساب");bw.setTextColor(Color.WHITE);bw.setBackgroundColor(Color.parseColor("#25D366"));bw.setOnClickListener(v->{startActivity(new Intent(Intent.ACTION_VIEW,Uri.parse(wa)));});
          top.addView(bf,new LinearLayout.LayoutParams(0,-2,1));top.addView(bw,new LinearLayout.LayoutParams(0,-2,1));
          LinearLayout header=new LinearLayout(this);header.setOrientation(1);header.setGravity(Gravity.CENTER);header.setPadding(0,35,0,50);header.setBackgroundColor(Color.parseColor("#1976D2"));
          TextView logo=new TextView(this);logo.setText("الشرق");logo.setTextColor(Color.WHITE);logo.setTextSize(22);logo.setGravity(Gravity.CENTER);
          GradientDrawable circ=new GradientDrawable();circ.setShape(1);circ.setStroke(3,Color.WHITE);circ.setColor(Color.parseColor("#1565C0"));logo.setBackground(circ);
          int s=(int)(90*getResources().getDisplayMetrics().density);logo.setLayoutParams(new LinearLayout.LayoutParams(s,s));logo.setOnLongClickListener(v->{login();return true;});
          TextView t1=new TextView(this);t1.setText("فريق الشرق");t1.setTextColor(Color.WHITE);t1.setTextSize(24);t1.setGravity(Gravity.CENTER);t1.setPadding(0,15,0,0);t1.setTypeface(null,Typeface.BOLD);
          TextView t2=new TextView(this);t2.setText("الرياضي الثقافي الاجتماعي بالحامي");t2.setTextColor(Color.WHITE);t2.setTextSize(13);t2.setGravity(Gravity.CENTER);
          header.addView(logo);header.addView(t1);header.addView(t2);
          GridLayout grid=new GridLayout(this);grid.setColumnCount(2);grid.setPadding(15,15,15,15);grid.setUseDefaultMargins(true);
          grid.addView(card("نبذة عن الفريق"));grid.addView(card("رؤساء الفريق"));grid.addView(card("انجازات الفريق"));grid.addView(card("أنشطة الفريق"));grid.addView(card("رحلات الفريق"));grid.addView(card("معرض الصور"));
          ScrollView sv=new ScrollView(this);LinearLayout cont=new LinearLayout(this);cont.setOrientation(1);cont.addView(header);cont.addView(grid);
          TextView hint=new TextView(this);hint.setText("اضغط مطولا على الشرق للدخول كمدير - كلمة السر 1234");hint.setGravity(Gravity.CENTER);hint.setTextColor(Color.GRAY);hint.setTextSize(10);hint.setPadding(0,20,0,30);cont.addView(hint);sv.addView(cont);
          root.addView(top);root.addView(sv);setContentView(root);}
          CardView card(String title){CardView c=new CardView(this);c.setRadius(30);c.setCardElevation(5);c.setUseCompatPadding(true);GridLayout.LayoutParams lp=new GridLayout.LayoutParams();lp.width=0;lp.height=(int)(85*getResources().getDisplayMetrics().density);lp.columnSpec=GridLayout.spec(GridLayout.UNDEFINED,1f);lp.setMargins(10,10,10,10);c.setLayoutParams(lp);TextView tv=new TextView(this);tv.setText(title);tv.setGravity(Gravity.CENTER);tv.setTextColor(Color.parseColor("#0d47a1"));tv.setTypeface(null,Typeface.BOLD);c.addView(tv);c.setOnClickListener(v->{Intent i=new Intent(this,DetailActivity.class);i.putExtra("t",title);startActivity(i);});return c;}
          void login(){AlertDialog.Builder b=new AlertDialog.Builder(this);b.setTitle("دخول المدير");EditText e=new EditText(this);e.setHint("كلمة السر 1234");b.setView(e);b.setPositiveButton("دخول",(d,w)->{if(e.getText().toString().equals("1234")){Intent i=new Intent(this,DetailActivity.class);i.putExtra("t","لوحة المدير");i.putExtra("admin",true);startActivity(i);}else Toast.makeText(this,"خطأ",0).show();});b.setNegativeButton("الغاء",null);b.show();}
          }
          ENDOFFILE
          cat > app/src/main/java/com/alsharq/team/DetailActivity.java <<'ENDOFFILE'
          package com.alsharq.team;
          import android.app.*;import android.content.*;import android.os.Bundle;import android.view.*;import android.widget.*;import androidx.appcompat.app.AppCompatActivity;import java.util.*;
          public class DetailActivity extends AppCompatActivity{
          String title;boolean admin;LinearLayout list;SharedPreferences pref;ArrayList<String> items;
          protected void onCreate(Bundle b){super.onCreate(b);title=getIntent().getStringExtra("t");admin=getIntent().getBooleanExtra("admin",false);
          LinearLayout root=new LinearLayout(this);root.setOrientation(1);root.setBackgroundColor(0xFFF5F7FB);
          LinearLayout h=new LinearLayout(this);h.setOrientation(0);h.setBackgroundColor(0xFF1976D2);h.setPadding(20,20,20,20);
          Button back=new Button(this);back.setText("رجوع");back.setTextColor(-1);back.setBackgroundColor(0);back.setOnClickListener(v->finish());
          TextView tv=new TextView(this);tv.setText(title);tv.setTextColor(-1);tv.setTypeface(null,1);tv.setGravity(17);tv.setLayoutParams(new LinearLayout.LayoutParams(0,-2,1));
          h.addView(back);h.addView(tv);
          if(admin){Button add=new Button(this);add.setText("+ إضافة");add.setTextColor(-1);add.setBackgroundColor(0xFF0d47a1);add.setOnClickListener(v->edit(-1));h.addView(add);}
          list=new LinearLayout(this);list.setOrientation(1);list.setPadding(20,20,20,20);
          ScrollView sv=new ScrollView(this);sv.addView(list);root.addView(h);root.addView(sv);setContentView(root);
          pref=getSharedPreferences("data",0);load();}
          void load(){list.removeAllViews();String k=title.replace(" ","_");String s=pref.getString(k,"");items=new ArrayList<>();if(!s.isEmpty())items.addAll(Arrays.asList(s.split(";;")));else if(!admin)items.add("لا يوجد محتوى بعد");
          for(int i=0;i<items.size();i++){LinearLayout card=new LinearLayout(this);card.setOrientation(1);card.setBackgroundColor(-1);card.setPadding(25,25,25,25);LinearLayout.LayoutParams lp=new LinearLayout.LayoutParams(-1,-2);lp.setMargins(0,0,0,15);card.setLayoutParams(lp);card.setElevation(4);
          TextView t=new TextView(this);t.setText(items.get(i));t.setTextSize(15);card.addView(t);
          if(admin){LinearLayout bb=new LinearLayout(this);bb.setOrientation(0);Button e=new Button(this);e.setText("تعديل");Button d=new Button(this);d.setText("حذف");d.setTextColor(0xFFFF0000);int idx=i;d.setOnClickListener(v->{items.remove(idx);save();load();});e.setOnClickListener(v->edit(idx));bb.addView(e,new LinearLayout.LayoutParams(0,-2,1));bb.addView(d,new LinearLayout.LayoutParams(0,-2,1));card.addView(bb);}list.addView(card);}}
          void edit(int idx){AlertDialog.Builder b=new AlertDialog.Builder(this);b.setTitle(idx==-1?"إضافة":"تعديل");EditText e=new EditText(this);e.setMinLines(3);e.setPadding(20,20,20,20);if(idx>=0)e.setText(items.get(idx));b.setView(e);b.setPositiveButton("حفظ",(d,w)->{String txt=e.getText().toString();if(txt.isEmpty())return;if(idx>=0)items.set(idx,txt);else items.add(txt);save();load();});b.setNegativeButton("الغاء",null);b.show();}
          void save(){pref.edit().putString(title.replace(" ","_"),String.join(";;",items)).apply();Toast.makeText(this,"تم الحفظ",0).show();}
          }
          ENDOFFILE
          gradle wrapper --gradle-version 8.4
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon
    artifacts:
      - app/build/outputs/apk/debug/*.apk
